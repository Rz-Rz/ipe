violations: ["packages/kernel/src/kernel.ts:266-267 (writeUnit): the in-memory text is replaced before the storage write. When the write is refused (TST-KER-012b injects ENOSPC at the unit file), the kernel holds the new text while the disk holds the previous one. Observed from the scratchpad on the delivered sources: externalText(unit) then returns the unchanged disk text as an external edit; a retry of the same save once the disk has room is refused with code conflict; a retry with force returns a version (early return at line 265, the two texts being equal) and writes nothing; the reopened project holds the previous text and the author's text is lost. Requirements: SPEC-KER-012, degraded case (the previous state is intact on disk, but the product cannot save again), and SPEC-KER-009 (a unit reported as changed on disk that did not change). Correction inside the scope: set the text after the storage write succeeded, or restore the previous text when the write throws; extend TST-KER-012b (packages/adapters-node/test/ker-012.test.ts:95-107) so that the same kernel retries the save after the refusal and the disk then holds the author's text.","docs/FORMAT.md:10 (Section 1, item 4) states that a save writes blobs, then objects, then the versions index, then the state. The kernel writes the unit file, then the touched objects, then the blob, then the versions index, then the state (packages/kernel/src/kernel.ts:267-270, 337, 348, 350; observed as five write steps in that order). REPORT.md item 4 and DOC_UPDATE.md state the right order. The document SPEC-KER-008 makes normative must state the order the kernel follows, the unit file included, since Section 7 reads interrupted saves from it. The header comment of packages/kernel/src/kernel.ts:4-6 repeats the wrong order. Requirement: SPEC-KER-008.","docs/FORMAT.md:75 (Section 5) enumerates the version actions as create, write, external, add-unit. The kernel also records adopt-unit (packages/kernel/src/kernel.ts:234), observed in the index of a project with an adopted unit; a reader that validates the enumeration refuses a store the kernel wrote. Requirement: SPEC-KER-008.","docs/FORMAT.md:9 (Section 1, item 3) states that everything under .ipe/ is JSON with keys sorted at every level, two-space indentation and one trailing newline. The journal lines are compact JSON with keys in insertion order (id, at, kind, actor, objectId, before, after, note; packages/kernel/src/kernel.ts:748). Section 6 shows the right shape; item 3 must except the journal. Requirement: SPEC-KER-008.","docs/FORMAT.md:92 (Section 6) and SPEC_UPDATE.md:14 state that a journal line that is not JSON is skipped and counted when the project opens. The count parseEvents computes is discarded by Kernel.open (packages/kernel/src/kernel.ts:143) and no field of OpenReport carries it (observed: a truncated last line, nothing reported). Either report the count or state skipped only. Requirement: SPEC-KER-008.","Minor: docs/FORMAT.md does not say that a write interrupted between the temporary file and the rename leaves a file named target.pid.time.random.tmp beside the target (packages/adapters-node/src/index.ts:39-48). The kernel ignores such files (observed at reopen with stray .tmp files in the project root and under .ipe/objects and .ipe/); the document should tell a reader to ignore them. Requirement: SPEC-KER-008."]
