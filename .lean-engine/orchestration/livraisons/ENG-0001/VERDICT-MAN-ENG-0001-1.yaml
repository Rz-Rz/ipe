violations: ["SPEC-KER-005: TST-KER-005d (packages/kernel/test/ker-005.test.ts:41-78) never produces a stale object. Its operation 0 (lines 54-57) appends a letter after the anchored word (abcde becomes abcdeQ): the passage stays present and the anchor stays intact. A replica of the test with its seed observed 0 stale objects in 800 checks and 0 refresh calls over the 20 rounds, so the invariant is never exercised and the test cannot fail (Constitution 6.6: a coverage sentence never says more than a named test proves). Correct operation 0 so that it edits inside the passage or deletes it, keep the revert and the refresh paths, and assert that stale objects were observed during the run.","SPEC-KER-006: createObject (packages/kernel/src/kernel.ts:359-391; lines 367 and 381) derives the approval from the declared origin and not from the actor. createObject({origin: 'author'}, 'assistant') yields an object accepted at birth with approvedBy 'assistant' and a create event whose actor is the assistant. The requirement says an object created by the assistant enters as a proposal and only an author action accepts. Refuse an origin 'author' from a non-author actor (code not_author) or derive origin and approval from the actor, and add the case to ker-006.test.ts.","SPEC-KER-003, error case (a deleted passage enters the orphaned state): the context fallback of resolveAnchor (packages/kernel/src/anchors.ts:71-92 and 129-141) matches each context window by any surviving fragment of 6 characters found anywhere in the unit and takes the shortest region between two fragments as the changed passage. A passage deleted together with its two windows is then reported changed, with current and the range pointing to an unrelated sentence: observed with the passage 'Mara counted the boats twice before she trusted the number' deleted and its neighbours rewritten, the anchor came back changed at 237..260 with current 'The bell rang once more', a sentence of the last paragraph; with no recurring fragment the same edit yields orphaned. The design note (Section 3, rule 5) says context never invents a match. Bound the fallback (a full window, or fragments located near the original range and in their original order), or report orphaned when neither full window survives; then restate the known limit of REPORT.md and the SPEC-KER-003 reservation of SPEC_UPDATE.md, which state the opposite direction only.","SPEC-KER-007, degraded case (a deletion while the history cannot be written is refused, never performed): deleteObject (packages/kernel/src/kernel.ts:436-444) persists the tombstone (line 440) before it appends the journal event (line 443). With a storage whose journal write fails, the error is raised but the deletion is performed: the object file holds deleted: true, the object leaves the live list, and after a reopen no delete event exists, so the previous state is not recoverable. Append the event before the tombstone and leave the object untouched when the journal write fails (same order in decide, lines 430-431, and in editObject, lines 408-409), or state the reservation in SPEC_UPDATE.md and leave the proof to the fault injection of ENG-0002.","SPEC-KER-003 (exclusion), SPEC-KER-011 (degraded case), SPEC-KER-014 (ambiguous count): the ambiguous state (packages/kernel/src/anchors.ts:106-114 and 155) is implemented and behaves as specified under a probe (two candidates listed, the object invalidated with an anchorChanges entry to ambiguous, counts.ambiguous equal to 1), but no delivered test exercises it: TST-KER-003f draws distinct words and expects only intact, changed and orphaned (packages/kernel/test/ker-003.test.ts:77, 95, 99). The coverage sentences say more than a named test proves (Constitution 6.6). Add a unit test with its row proposed in SPEC_UPDATE.md, or state the reservation. In the same area, explain (packages/kernel/src/kernel.ts:583) returns the text at the stale range as the passage of an ambiguous anchor (observed 'o t' for a unit 'x two two'); return null, as for an orphaned anchor, or the passages of the candidates.","SPEC-KER-014: Counts.intact, changed, ambiguous and orphaned (packages/kernel/src/types.ts:161-167, packages/kernel/src/kernel.ts:617-618) count anchors, while the requirement asks for the count of objects by state; the independent walk of TST-KER-014a (packages/kernel/test/ker-014.test.ts:22-27) mirrors the implementation's definition rather than the requirement's. Count the objects that carry at least one anchor in each state (the anchor counts may stay beside them), or state the definition in SPEC_UPDATE.md as a reservation."]
