violations: ["packages/providers/src/failures.ts:53-54 (failureFromThrown): the aborted-signal test precedes the TimeoutError test, so a timeout armed on the caller's signal (AbortSignal.timeout, or AbortSignal.any combined with the author's signal) is reported as the state cancelled. Under the delivered design, where the caller's signal is the timeout (REPORT.md, known limits; docs/PROVIDER_DESIGN.md Section 6), the state timed_out is unreachable through the Claude adapter (packages/providers-claude/src/index.ts:90 and :121), and the ask action's call record then says outcome cancelled, failure cancelled, for a call that timed out (packages/assistant/src/index.ts:147-153): the author is told of a cancellation they did not make. Observed from the scratchpad: failureFromThrown(reason, signal) gives cancelled where the same reason without the signal gives timed_out; the platform's fetch rejects a signal timeout with an error named TimeoutError and signal.aborted true. Requirement SPEC-PRV-006 (timed out as a named state) and definition of done, criterion 1 (the failure states and their mapping rules). TST-PRV-006a proves timed_out only through the fake provider's direct construction of the state, and packages/providers/test/catalogue.test.ts:39-41 has no case with an aborted signal whose reason is a TimeoutError. Correction inside the scope: test the thrown error's name, or the signal's reason name, for TimeoutError before the aborted test, and add that case to the test.","packages/assistant/src/index.ts:146-160: the cancellation check after the provider answered runs once, when the answer arrives (line 146); a cancellation that lands while the record is being completed (line 157, one storage write) still creates the answer object (line 159), and the record says completed. Observed from the scratchpad with the fake provider: the signal aborted before createObject, the answer created and proposed beside a record marked completed. Requirement SPEC-PRV-006, degraded case (a cancellation after the provider answered keeps nothing of the answer). Correction inside the scope: test the signal again immediately before creating the answer and record the cancellation when it is aborted; REPORT.md's known limits then describe the remaining window exactly.","SPEC_UPDATE.md (coverage note SPEC-AST-001, nominal and degraded) and REPORT.md (what remains for ENG-0006): the note presents the degraded case as covered by the kernel's staleness when the text changes afterwards; the requirement's degraded case is a change during the call, and it is not met. Observed from the scratchpad: when the unit's text changes while the fake provider answers, the answer object carries the version after the change (record version id-000004, answer version id-000007), its anchors are read from the new text at the old offsets (state intact, text unrelated to the passage sent) and stale is false. The kernel creates objects against the current version only (packages/kernel/src/kernel.ts:456 and :474; CreateObjectInput has no version field), so the action cannot meet the clause inside this scope. Correction inside the scope: state the case as remaining, with the kernel change it needs, in SPEC_UPDATE.md and in REPORT.md (Constitution Section 6, rule 6: a coverage sentence never says more than a named test proves)."]
