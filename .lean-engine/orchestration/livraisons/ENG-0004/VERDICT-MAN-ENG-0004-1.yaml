oves.","packages/kernel/src/kernel.ts:56, 292-293, 381 (one boolean flag for the whole kernel), ENG-0004 definition of done criterion 1 (a retry of the identical text in the same kernel completes the save; no restriction to an immediate retry): a completed save of another unit clears the flag, and the retry of the refused unit takes the early return again. Probe from the scratchpad: unit A's save refused at step 2 (objects) or step 3 (blob), then unit B saved with a new text, then A's identical text saved again: no version is recorded, A's blob at the current version is absent (readVersion returns null: a version that names a hash without a blob, unverifiable per docs/FORMAT.md Section 5), at step 2 A's object file keeps the previous anchors, and a reopen reports neither an external change nor an interruption. REPORT.md decision 1 ('a refusal leaves the flag raised until a save completes, whichever unit it is for; the cost of a raised flag is one save of a text already held, which is the repair') does not hold: B's save writes neither A's blob nor A's objects. The desktop interface saves units as the author moves between them, so the interleaving is an ordinary sequence. Correction inside the scope: track the incomplete saves per unit (a set of unit identifiers, the unit added before the first write of its save and removed once the state of that save is written), and add the interleaved sequence to TST-KER-012d or as TST-KER-012e (a second unit saved between the refusal and the retry; the retry records a version, readVersion of the retried version returns the text, and the object files equal the live objects)."]
