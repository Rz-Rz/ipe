violations: ["apps/desktop/src/renderer/App.tsx:97-107, 123-153 and 157-168: a save scheduled by a keystroke resolves its unit at save time (selectedRef.current, line 125) and selecting another unit neither cancels nor flushes it (the equal-text branch at lines 100-103 clears no timer; openUnit cancels nothing). Probe P2: typing ' more' in unit X then selecting unit Y within 600 ms wrote 'xxx more' into y.md and left x.md at 'xxx': another unit overwritten silently, the edit lost, the indicator at unsaved with no save to follow. SPEC-PRJ-003 (automatic save of the open unit; degraded case: never overwrites silently); definition of done, criterion 3 (write in a unit with the save state visible).","apps/desktop/src/renderer/App.tsx:100-106: an edit reverted within the interval leaves the earlier timer alive. Probe P3: on a saved 'zzz', type 'a' then Backspace; the disk received 'zzza', the screen shows 'zzz', the indicator stays unsaved and no save follows. SPEC-PRJ-003, nominal case (a change is saved within the interval and the state shows saved).","apps/desktop/src/renderer/App.tsx:333 with apps/desktop/src/main/service.ts:59-62 and packages/kernel/src/kernel.ts:179-183: 'Take the disk version' calls openUnit, and readUnit returns the kernel's in-memory text, never the disk. Probe P4: after the gesture the editor shows the stale text 'first' with the indicator at saved while the disk holds 'disk version'; the next edit conflicts again; the disk text cannot be adopted from the interface. REPORT.md:40 states that the gesture reloads the unit. SPEC-PRJ-003 (the state shown at all times; degraded case). Mutant X3 (the gesture made a no-op) survives TST-PRJ-003a: no named test guards the gesture that SPEC_UPDATE.md:23 names, against CONSTITUTION.md Section 6, rule 6.","apps/desktop/src/renderer/App.tsx:99 and 165, with the installed @codemirror/state 6.x (Text.of splits on /\\r\\n?|\\n/ and toString joins with '\\n'): a CRLF unit loaded into the editor comes back LF-only, the update listener sees a text different from lastSaved and schedules a save. Probe P1: a folder of two CRLF Markdown files adopted then browsed (each unit selected once, nothing typed) was rewritten with LF ('Line one\\r\\nLine two\\r\\n' became 'Line one\\nLine two\\n'; indicator sequence saved > unsaved > saved per unit). SPEC-PRJ-001, limit case (no file rewritten); SPEC-PRJ-006 (verbatim preservation) on the editor path. REPORT.md:43 ('no normalisation anywhere') and SPEC_UPDATE.md:26 ('CRLF preserved verbatim') say more than TST-PRJ-006a and TST-PRJ-006b prove, which run below the editor: CONSTITUTION.md Section 6, rule 6.","e2e/prj.spec.ts:68-81 (TST-PRJ-001b): LF files only, strings compared, and no second unit selected, so the test cannot observe violation 4. The guard to add: a CRLF file (and one without final newline) adopted, each unit selected from the outline, bytes compared with Buffer.equals after the save interval; and a round trip through the interface for SPEC-PRJ-006 beside the storage-level TST-PRJ-006a and 006b. CONSTITUTION.md Section 6, rules 4 and 6.","apps/desktop/src/main/service.ts:89-91 with the coverage note SPEC_UPDATE.md:18 ('live objects anchored to the moved unit or its descendants'): mutant X4 (descendants not counted) survives TST-PRJ-002a and apps/desktop/test/service.test.ts; mutant X5 (tombstones counted) survives service.test.ts. The clause enters the folder without a guard proved by mutant injection: CONSTITUTION.md Section 6, rule 6. SPEC-PRJ-002.","packages/kernel/src/kernel.ts:713-734 (search, limit 200, unchanged by the branch but inside the scope) with apps/desktop/src/renderer/App.tsx:349-358: the interface lists at most 200 hits and says nothing when the list is cut, while SPEC-PRJ-005 requires every occurrence across all units and all objects and TST-PRJ-005a is titled 'every occurrence'. SPEC_UPDATE.md:25 proposes to write the cap into the coverage, which changes what the requirement promises without an SCP. Inside the scope: either return every occurrence or carry the truncation to the author (total count beside the 200 shown); the requirement text itself is for an SCP (see motif_arbitrage, no arbitration needed)."]
