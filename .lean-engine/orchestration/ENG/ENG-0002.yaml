  1. docs/FORMAT.md documents the on-disk layout of a project (manifest, Markdown units, .ipe/ objects, versions, blobs, journal, state) completely enough that an independent reader written from it alone reads a whole store.
  2. packages/adapters-node implements the kernel's adapters on Node with atomic writes; the tests TST-KER-008a to TST-KER-008c, TST-KER-009a to TST-KER-009c and TST-KER-012a to TST-KER-012b exist under their names on temporary folders and pass, including the fault injection at each step of a write and the full-disk simulation.
  3. REPORT.md opens with the result against this definition and names each requirement with the tests that prove it.
