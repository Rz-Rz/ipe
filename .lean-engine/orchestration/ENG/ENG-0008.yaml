definition_of_done: >
  1. The desktop interface holds the memory panel of docs/MEMORY_DESIGN.md Section 7: entries
  grouped by category with their state, filters by unit and by state, a text search, the entries
  of the open unit beside the editor with a jump to the passage, the extraction gesture with the
  preview and the review of the proposals one by one, the provenance question on any entry, the
  corrections, the disputed mark and the merge with undo; the channel carries the calls the
  section lists. 2. The tests TST-MEM-004a, TST-MEM-006b, TST-MEM-007a and TST-AST-002a exist
  under their names and pass in the browser against the bridge with the fake provider replaying
  the recorded answers of the corpus; the Electron smoke test still passes. 3. A user can, in the
  running application: extract a chapter, review and accept proposals, ask why the project says
  something, correct and merge entries, and see entries go stale after a revision; the report
  lists these gestures with the screenshots the tests captured. 4. REPORT.md opens with the result
  against this definition and names each requirement with the tests that prove it.
