notes: >
  2026-10-16: drafted by the coordinator from open point 2 of the delivery
  report of ENG-0005 (held the same day), after the verdict MAN-ENG-0005-1
  found the degraded case of SPEC-AST-001 not met: the kernel creates objects
  against the current version only, so the answer of a call during which the
  text changed is anchored to the new text and not marked stale. The report
  recommends this work before ENG-0006 takes the interface; no precedence was
  added on ENG-0006, since its e2e test does not exercise the degraded case,
  and the operator decides the sequencing.
