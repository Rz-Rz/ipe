definition_of_done: >
  1. The desktop application connects, tests and disconnects a provider with an author-supplied
  key kept in the operating system's secret store through Electron's safeStorage, or in session
  memory when it is unavailable, and never in the project folder nor in clear in any file; the
  HTTP bridge keeps keys in memory. 2. The interface shows, per connection, its state, its
  models, its capabilities and billing from the catalogue, and after each call the usage and the
  estimate marked as such or "not reported"; it shows the preview of what an ask will send before
  the first call; it runs the ask action on the chosen connection and model only, shows the
  answer as a proposed object with its provenance, shows each failure state with retry and
  abandon, lets the author cancel a running call, and lets the author edit the project's
  instructions. 3. The tests TST-PRV-001a, 001b, 004a and TST-AST-001a exist under their names
  and pass, in the browser against the bridge with the fake provider registered; the Electron
  smoke test still passes. 4. A user can, in the running application: connect a key, read the
  capabilities and the cost of a call, ask about a chapter and read the answer's provenance,
  switch the provider; the report lists these gestures with the screenshots the tests captured.
  5. REPORT.md opens with the result against this definition and names each requirement with
  the tests that prove it.
